name: Alerta de Cupons Shopee

on:
  workflow_dispatch:
    inputs:
      modo_teste:
        description: 'Enviar notificacao de teste? (sim/nao)'
        required: false
        default: 'sim'
      desconto_minimo_reais:
        description: 'Desconto minimo em Reais (0 = todos)'
        required: false
        default: '0'

jobs:
  verificar_cupons:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Buscar cupons novos e notificar via ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MODO_TESTE: ${{ github.event.inputs.modo_teste }}
          DESCONTO_MIN: ${{ github.event.inputs.desconto_minimo_reais }}
        run: |
          python3 - << 'EOF'
          import os
          import re
          import json
          import html
          import urllib.request
          import urllib.parse

          topico = os.environ.get("NTFY_TOPIC", "").strip().strip("/")
          modo_teste = (os.environ.get("MODO_TESTE") or "nao").strip().lower()
          desconto_str = (os.environ.get("DESCONTO_MIN") or "0").strip()

          try:
              desconto_min = float(desconto_str.replace(",", "."))
          except ValueError:
              desconto_min = 0.0

          if not topico:
              raise SystemExit("ERRO: Secret NTFY_TOPIC vazio ou nao configurado.")

          # Montagem segura de URLs sem risco de corte de barras
          def criar_url(dominio, caminho, query=""):
              caminho_limpo = "/" + caminho.lstrip("/")
              return urllib.parse.urlunsplit(("https", dominio, caminho_limpo, query, ""))

          url_ntfy_post = criar_url("ntfy.sh", topico)
          url_ntfy_hist = criar_url("ntfy.sh", f"{topico}/json", "poll=1&since=24h")
          url_shopee_click = criar_url("shopee.com.br", "m/cupons-diarios")

          fontes = {
              "Pelando": criar_url("://pelando.com.br", "cupons-de-descontos/shopee"),
              "Cuponomia": criar_url("://cuponomia.com.br", "desconto/shopee"),
              "Meliuz": criar_url("://meliuz.com.br", "desconto/cupom-shopee"),
          }

          headers_nav = {
              "User-Agent": "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Mobile Safari/537.36",
              "Accept-Language": "pt-BR,pt;q=0.9",
          }

          # 1. Ler historico das ultimas 24h direto do ntfy para nao repetir cupom
          ja_enviados = set()
          try:
              req_hist = urllib.request.Request(url_ntfy_hist, headers=headers_nav)
              with urllib.request.urlopen(req_hist, timeout=15) as resp:
                  for linha in resp.read().decode("utf-8", errors="ignore").splitlines():
                      if not linha.strip():
                          continue
                      try:
                          evento = json.loads(linha)
                          msg = evento.get("message", "")
                          for cod in re.findall(r"\b[A-Z0-9]{5,15}\b", msg.upper()):
                              ja_enviados.add(cod)
                      except Exception:
                          pass
          except Exception as e:
              print(f"Aviso ao consultar historico ntfy: {e}")

          # 2. Varrer as paginas de cupons da Shopee
          ignorar = {
              "SHOPEE", "CUPOM", "CUPONS", "DESCONTO", "DESCONTOS", "GRATIS",
              "FRETE", "BRASIL", "OFERTA", "OFERTAS", "PROMOCAO", "MELIUZ",
              "PELANDO", "CUPONOMIA", "HTML", "HTTPS", "SCRIPT", "STYLE",
              "WINDOW", "DOCUMENT", "FUNCTION", "RETURN", "TRUE", "FALSE",
              "NULL", "UNDEFINED", "CLASS", "BUTTON", "HEADER", "FOOTER",
              "SHOPEEBR", "COMPRA", "COMPRAS", "LOJAS", "TODOS", "TODAS",
              "ATIVO", "ATIVOS", "EXPIRADO", "VERIFICADO", "PEGAR", "COPIAR"
          }

          padroes_extracao = [
              r'"(?:code|couponCode|voucherCode|promoCode|cupom)"\s*:\s*"([A-Za-z0-9]{5,15})"',
              r'(?:cupom|c[oó]digo)\s*[:\-]?\s*<[^>]+>\s*([A-Z0-9]{5,15})\s*<',
              r'\b(?:usar?\s+o?\s*cupom|c[oó]digo\s+promocional)\s+([A-Z0-9]{5,15})\b',
          ]

          encontrados = {}

          for nome_fonte, url_fonte in fontes.items():
              try:
                  req = urllib.request.Request(url_fonte, headers=headers_nav)
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      conteudo = html.unescape(resp.read().decode("utf-8", errors="ignore"))

                  for padrao in padroes_extracao:
                      for match in re.finditer(padrao, conteudo, flags=re.IGNORECASE):
                          codigo = match.group(1).upper().strip()
                          # Exige pelo menos 1 letra e 1 numero ou tamanho tipico de cupom valido sem ser palavra comum
                          if codigo in ignorar or codigo.isdigit() or len(codigo) < 5:
                              continue
                          if not any(c.isalpha() for c in codigo):
                              continue

                          trecho = conteudo[max(0, match.start() - 250):min(len(conteudo), match.end() + 250)]
                          valores_reais = [
                              float(v.replace(",", "."))
                              for v in re.findall(r"R\$\s*(\d+(?:[.,]\d{1,2})?)", trecho)
                          ]
                          maior_valor = max(valores_reais) if valores_reais else 0.0

                          if desconto_min > 0 and maior_valor < desconto_min:
                              continue

                          if codigo not in ja_enviados and codigo not in encontrados:
                              info_valor = f" (ate R$ {maior_valor:g})" if maior_valor > 0 else ""
                              encontrados[codigo] = f"{codigo}{info_valor} [{nome_fonte}]"
              except Exception as e:
                  print(f"Erro ao ler {nome_fonte} ({url_fonte}): {e}")

          # 3. Disparar notificacao no ntfy (se houver cupom novo ou se for teste manual)
          def enviar_ntfy(titulo, texto, prioridade="default", tags="shopping,tag"):
              headers_post = {
                  "Title": titulo,
                  "Priority": prioridade,
                  "Tags": tags,
                  "Click": url_shopee_click,
              }
              req_post = urllib.request.Request(
                  url_ntfy_post,
                  data=texto.encode("utf-8"),
                  headers=headers_post,
                  method="POST",
              )
              with urllib.request.urlopen(req_post, timeout=15) as r:
                  print(f"Notificacao enviada! Status HTTP ntfy: {r.status}")

          if encontrados:
              lista_linhas = "\n".join(f"- {detalhe}" for detalhe in list(encontrados.values())[:15])
              corpo = f"Novos cupons Shopee detectados:\n{lista_linhas}\n\nToque para abrir os cupons diarios."
              enviar_ntfy("Cupons Novos Shopee!", corpo, prioridade="high", tags="fire,shopping")
          elif modo_teste == "sim":
              corpo = (
                  "Teste concluido com sucesso! Conexao GitHub -> ntfy funcionando.\n"
                  f"Nenhum cupom inedito nas ultimas 24h (historico atual: {len(ja_enviados)} codigos).\n"
                  "Toque na notificacao para testar o atalho da Shopee."
              )
              enviar_ntfy("Teste Alerta Shopee OK", corpo, prioridade="default", tags="white_check_mark")
          else:
              print("Nenhum cupom novo encontrado e modo_teste='nao'. Silencio mantido.")
          EOF
